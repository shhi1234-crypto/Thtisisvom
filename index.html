<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4fa">

  <title>VOM · Voice of Melody</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
/* =========================================================
   SOFT HANDWRITTEN TYPOGRAPHY
========================================================= */

/* 큰 날짜 */
.next-date{
  font-family:"Nanum Pen Script", cursive;
  font-size:72px;
  letter-spacing:-2px;
  font-weight:400;
}

/* 날짜 옆 요일 */
.next-date small{
  font-family:"Nanum Pen Script", cursive;
  font-size:22px;
  font-weight:400;
  letter-spacing:0;
}

/* 다가오는 일정 카드 날짜 */
.event-date{
  font-family:"Nanum Pen Script", cursive;
  font-size:40px;
  letter-spacing:-1px;
  font-weight:400;
}

.event-date small{
  font-family:"Nanum Pen Script", cursive;
  font-size:18px;
  font-weight:400;
}

/* NEXT LIVE / Upcoming / Notice 같은 포인트 영문 */
.next-top,
.event-dday{
  font-family:"Nanum Pen Script", cursive;
  letter-spacing:.5px;
  font-size:16px;
}

/* LIVE 제목도 살짝 부드럽게 */
.next-live h3{
  font-family:"Nanum Pen Script", cursive;
  font-size:27px;
  font-weight:400;
}

/* 카드 안 이벤트명 */
.event-name{
  font-family:"Nanum Pen Script", cursive;
  font-size:21px;
  font-weight:400;
}

/* D-DAY 알약 */
.d-day{
  font-family:"Nanum Pen Script", cursive;
  font-size:17px;
  font-weight:400;
}

/* ABOUT VOM / 카드 내 포인트 텍스트도 살짝 통일 */
.about-link,
.more{
  font-family:"Nanum Pen Script", cursive;
  font-size:17px;
}

/* 모바일 */
@media(max-width:760px){

  .next-date{
    font-size:62px;
  }

  .next-date small{
    font-size:19px;
  }

  .event-date{
    font-size:35px;
  }

  .event-date small{
    font-size:16px;
  }

  .next-live h3{
    font-size:24px;
  }

}
