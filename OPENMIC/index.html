<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOM OPEN MIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon.png?v=3">
<link rel="shortcut icon" type="image/png" href="/favicon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#181b2c;--muted:#85899b;--line:#e8e6ef;--purple:#7865dc;
  --card:rgba(255,255,255,.86);--shadow:0 18px 50px rgba(50,43,88,.09);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Noto Sans KR",sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 82% 1%,rgba(142,228,218,.34),transparent 30%),
    radial-gradient(circle at 5% 18%,rgba(212,193,255,.28),transparent 34%),
    #faf9fd;
  min-height:100vh;padding-bottom:92px;
}
a{color:inherit}
header{
  height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;border-bottom:1px solid rgba(229,226,239,.72);
  background:rgba(255,255,255,.58);backdrop-filter:blur(18px);position:sticky;top:0;z-index:50
}
.brand{font-family:"Nanum Pen Script";font-size:28px;text-decoration:none}
.menu-btn{border:0;background:transparent;font-size:20px;cursor:pointer}
.admin-badge{display:none;font-size:10px;font-weight:800;color:#6c57c5}
.admin-badge.show{display:block}
.page{width:min(1120px,calc(100% - 36px));margin:38px auto 0}
.hero{padding:22px 0 28px}
.kicker{font-size:10px;font-weight:800;letter-spacing:.16em;color:#7b66d5}
.hero h1,.detail-title,.ranking-title{
  margin:5px 0 10px;font-family:"Nanum Pen Script";font-weight:400;font-size:58px;line-height:1
}
.hero p{margin:0;max-width:680px;color:#707487;line-height:1.8;font-size:14px}
.intro{
  margin:8px 0 30px;padding:26px;border-radius:28px;background:linear-gradient(135deg,rgba(246,235,245,.96),rgba(235,250,247,.94));
  border:1px solid rgba(111,88,190,.12);box-shadow:var(--shadow)
}
.intro h2{margin:5px 0 10px;font-size:24px}
.intro p{margin:0;color:#6f7180;font-size:14px;line-height:1.8}
.intro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.intro-grid div{padding:15px;border-radius:18px;background:rgba(255,255,255,.7)}
.intro-grid strong{display:block;font-size:13px;margin-bottom:4px}
.intro-grid small{font-size:11px;color:#818493;line-height:1.5}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}
.section-head h2{margin:0;font-size:21px}
.list{display:grid;gap:12px}
.card{
  display:grid;grid-template-columns:92px 1fr 150px;gap:18px;align-items:center;padding:17px;
  border-radius:23px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 32px rgba(44,40,75,.05);
  text-decoration:none
}
.datebox{display:flex;justify-content:center;align-items:center;min-height:76px;border-radius:18px;background:#f2effb}
.datebox strong{font-size:27px}.datebox small{display:block;text-align:center;color:#777b8c;font-size:10px}
.type{font-size:9px;font-weight:800;letter-spacing:.15em;color:#7a64d5}
.card h3{margin:4px 0 7px;font-size:18px}.meta{font-size:11px;color:#858898}.hint{margin-top:10px;font-size:11px;color:#715bc7}
.thumb{height:82px;border-radius:17px;overflow:hidden;background:linear-gradient(135deg,#eee8ff,#e2f6f1);display:flex;align-items:center;justify-content:center;font-family:"Nanum Pen Script";font-size:22px;color:#8b7dba}
.thumb img{width:100%;height:100%;object-fit:cover}
.empty{padding:34px;text-align:center;color:#9397a6;font-size:12px}
.back{display:inline-block;margin-bottom:17px;text-decoration:none;color:#6e7182;font-size:11px}
.detail{
  padding:26px;border-radius:30px;background:rgba(255,255,255,.88);border:1px solid var(--line);box-shadow:var(--shadow)
}
.detail-image{height:min(430px,48vw);min-height:230px;margin:20px 0;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#ece7ff,#e0f5f0);display:flex;align-items:center;justify-content:center;font-family:"Nanum Pen Script";font-size:30px;color:#8e81bd}
.detail-image img{width:100%;height:100%;object-fit:cover}
.detail-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.info{padding:15px;border:1px solid var(--line);border-radius:17px;background:#fff}
.info small{display:block;font-size:8px;color:#989baa;letter-spacing:.12em}.info strong{font-size:13px}
.desc{margin-top:16px;padding:17px;border-radius:18px;background:#f8f7fb;color:#6f7280;line-height:1.75;font-size:13px}
.winner-box{
  margin-top:18px;padding:20px;border-radius:22px;background:linear-gradient(135deg,#fff5dc,#f7e7ef);
  border:1px solid #f1dfb4
}
.winner-box .label{font-size:9px;font-weight:800;letter-spacing:.15em;color:#a27a34}
.winner-names{margin-top:4px;font-family:"Nanum Pen Script";font-size:31px}
.setlist-cta{
  margin-top:15px;padding:17px 18px;border-radius:19px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#ece7ff,#e6f7f3);border:1px solid #ddd5ff;text-decoration:none
}
.setlist-cta strong{display:block;font-size:14px}.setlist-cta small{font-size:10px;color:#808391}
.admin-actions{display:none;margin-top:15px;gap:8px}.admin-mode .admin-actions{display:flex}
.action-btn{padding:12px 15px;border:0;border-radius:14px;background:#eeeafd;color:#6551bf;font-weight:700;cursor:pointer}
.ranking-list{display:grid;gap:10px}
.rank-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:16px 18px;border-radius:19px;background:#fff;border:1px solid var(--line)}
.rank-no{font-family:"Nanum Pen Script";font-size:27px}.rank-name{font-weight:700}.rank-detail{font-size:10px;color:#8a8d9b}.rank-score{font-weight:800}.rank-score small{margin-left:4px;font-size:9px;color:#999}
.overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(28,28,43,.35);backdrop-filter:blur(12px)}
.overlay.open{display:flex}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:25px;border-radius:28px;background:#fff}
.modal-top{display:flex;justify-content:space-between;align-items:center}.modal-top h2{margin:0;font-family:"Nanum Pen Script";font-size:34px;font-weight:400}
.close{border:0;background:#f1f0f6;border-radius:50%;width:42px;height:42px;cursor:pointer}
.winner-editor{display:grid;gap:9px;margin-top:18px}
.winner-row{display:grid;grid-template-columns:1fr 45px;gap:8px}
.field{width:100%;padding:13px;border:1px solid #dedce7;border-radius:14px;background:#fff}
.remove{border:0;border-radius:13px;background:#fff0f2;color:#d3586d;cursor:pointer}
.add,.save{width:100%;margin-top:10px;padding:14px;border:0;border-radius:15px;cursor:pointer;font-weight:800}
.add{background:#f1eff9;color:#6654bd}.save{background:linear-gradient(135deg,#8069e8,#7288eb);color:#fff}
.menu-card{width:min(400px,100%)}.menu-card a{display:flex;justify-content:space-between;padding:14px 2px;text-decoration:none;border-bottom:1px solid var(--line);font-size:13px}
.bottom{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);z-index:80;width:min(590px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);padding:8px;border-radius:23px;background:rgba(255,255,255,.9);box-shadow:0 15px 50px rgba(42,37,72,.14);backdrop-filter:blur(18px)}
.bottom a,.bottom button{border:0;background:transparent;text-decoration:none;color:#7d8090;text-align:center;font-size:8px;padding:4px;cursor:pointer}.bottom span{display:block;font-size:16px;margin-bottom:2px}
@media(max-width:720px){
  .page{width:min(100% - 24px,1120px);margin-top:22px}.hero h1,.detail-title,.ranking-title{font-size:43px}
  .intro{padding:20px}.intro-grid{grid-template-columns:1fr}
  .card{grid-template-columns:66px 1fr 76px;gap:10px;padding:12px}.datebox{min-height:64px}.thumb{height:64px}.card h3{font-size:15px}
  .detail{padding:18px}.detail-meta{grid-template-columns:1fr}.detail-image{height:260px}
}
</style>
</head>
<body>
<header>
  <a href="/" class="brand">VOM</a>
  <div style="display:flex;align-items:center;gap:12px">
    <div id="adminBadge" class="admin-badge">● ADMIN MODE</div>
    <button class="menu-btn" onclick="openMenu()">☰</button>
  </div>
</header>

<main id="page" class="page"><div class="empty">대관공연을 불러오는 중...</div></main>

<div id="winnerOverlay" class="overlay">
  <div class="modal">
    <div class="modal-top"><h2>Open Mic Winner</h2><button class="close" onclick="closeWinnerEditor()">✕</button></div>
    <input type="hidden" id="winnerEventId">
    <div style="margin-top:8px;font-size:11px;color:#858899;line-height:1.65">MEMBERS에서 실제 우승자를 선택합니다. 공동 우승이면 여러 명을 추가할 수 있습니다.</div>
    <div id="winnerEditor" class="winner-editor"></div>
    <button class="add" onclick="addWinnerRow()">＋ 공동 우승자 추가</button>
    <button class="save" onclick="saveWinners()">우승 결과 저장</button>
  </div>
</div>

<div id="menuOverlay" class="overlay">
  <div class="modal menu-card">
    <div class="modal-top"><h2>VOM Menu</h2><button class="close" onclick="closeMenu()">✕</button></div>
    <a href="/">HOME <span>→</span></a>
    <a href="/info/">INFO <span>→</span></a>
    <a href="/calendar/">CALENDAR <span>→</span></a>
    <a href="/live/">VOM LIVE <span>→</span></a>
    <a href="/busking/">BUSKING <span>→</span></a>
    <a href="/OPENMIC/">OPEN MIC <span>→</span></a>
  </div>
</div>

<nav class="bottom">
  <a href="/"><span>⌂</span>HOME</a>
  <a href="/calendar/"><span>◫</span>CALENDAR</a>
  <a href="/members/"><span>♙</span>MEMBERS</a>
  <a href="/event/"><span>✦</span>EVENT</a>
  <button onclick="openMenu()"><span>☰</span>MENU</button>
</nav>

<script>
const SUPABASE_URL='https://aqfmhqultzpakfqwzulj.supabase.co';
const SUPABASE_KEY='sb_publishable_PfwvwgO6402LfeqLPbUBgg_2bCwaX4R';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let adminMode=false,events=[],locations=[],members=[],winners=[];

async function start(){
  await checkAdmin();
  await loadAll();
  const p=new URLSearchParams(location.search);
  const ranking=p.get('ranking'),id=p.get('id'),intro=p.get('intro');
  if(intro==='1') renderOpenMicIntro();
  else if(ranking==='winner') renderRanking();
  else if(id) await renderDetail(id);
  else renderMain();
}

async function checkAdmin(){
  const {data}=await db.auth.getSession();
  const session=data.session;
  if(!session){setAdmin(false);return}
  const {data:admin}=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  setAdmin(!!admin);
}
function setAdmin(v){adminMode=v;document.getElementById('adminBadge').classList.toggle('show',v)}

async function loadAll(){
  const [ev,loc,mem,win]=await Promise.all([
    db.from('events').select('*').order('event_date',{ascending:true}),
    db.from('locations').select('*'),
    db.from('members').select('*'),
    db.from('open_mic_winners').select('*')
  ]);
  events=(ev.data||[]).filter(isOpenMicEvent);
  locations=loc.data||[];
  members=(mem.data||[]).sort(compareMembers);
  winners=win.data||[];
  if(win.error) console.error('OPEN MIC WINNERS:',win.error);
}
function isOpenMicEvent(row){
  const type=String(row?.event_type||'');
  const title=String(row?.title||'').toUpperCase();
  return type==='OPEN MIC'||(type==='OTHER'&&(title.includes('OPEN MIC')||title.includes('대관공연')));
}
function compareMembers(a,b){
  const ao=Number(a.join_order??a.join_sequence??99999),bo=Number(b.join_order??b.join_sequence??99999);
  return ao-bo||String(a.name||'').localeCompare(String(b.name||''),'ko');
}
function memberLabel(m){
  const order=m.join_order??m.join_sequence??m.member_order??m.order_no??'';
  const role=m.role||'',region=m.region||m.area||'';
  return `${order!==''?'#'+order+' ':''}${m.name||''}${[role,region].filter(Boolean).length?' · '+[role,region].filter(Boolean).join(' · '):''}`;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function attr(v){return esc(v)}
function parseDate(s){return new Date(String(s)+'T00:00:00')}
function week(s){return ['일','월','화','수','목','금','토'][parseDate(s).getDay()]}
function fmtDate(s){const d=parseDate(s);return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')} (${week(s)})`}
function fmtTime(v){if(!v)return'';return String(v).slice(0,5)}
function makeTime(r){return [fmtTime(r.start_time),fmtTime(r.end_time)].filter(Boolean).join(' - ')}
function loc(r){return locations.find(x=>String(x.id)===String(r.location_id))}
function getWinners(id){return winners.filter(w=>String(w.event_id)===String(id))}
async function setlistExists(id){
  const {data}=await db.from('busking_setlist_settings').select('event_id').eq('event_id',Number(id)).maybeSingle();
  return !!data;
}

function renderOpenMicIntro(){
  document.title='대관공연 소개 · VOM';
  page.classList.toggle('admin-mode',adminMode);
  page.innerHTML=`
    <a class="back" href="/OPENMIC/">← OPEN MIC</a>
    <section class="hero">
      <div class="kicker">ABOUT OPEN MIC</div>
      <h1>Open Mic</h1>
      <p>공연장을 직접 대관해 하나의 공연을 함께 만드는 VOM의 정식 무대 컨텐츠입니다.</p>
    </section>

    <section class="intro">
      <div class="kicker">VOM STAGE</div>
      <h2>대관공연은요</h2>
      <p>
        연습실이나 거리보다 한 단계 더 큰 무대에서 준비한 곡을 관객에게 선보이는 공연입니다.
        회차마다 주제와 프로그램을 정하고, 참가자들이 각자의 무대를 준비해 하나의 공연으로 완성합니다.
      </p>
      <div class="intro-grid">
        <div><strong>정식 공연장</strong><small>대관한 무대에서 관객과 함께</small></div>
        <div><strong>회차별 컨셉</strong><small>주제와 프로그램을 정해 하나의 공연으로</small></div>
        <div><strong>우승 기록</strong><small>회차별 우승자를 남기고 누적 기록</small></div>
      </div>
    </section>

    <section class="intro" style="margin-top:12px;">
      <div class="kicker">HOW IT WORKS</div>
      <h2>이런 식으로 진행돼요</h2>
      <p>
        공연 일정이 열리면 참가자를 모집하고, 회차 컨셉에 맞춰 곡과 순서를 준비합니다.
        공연이 끝난 뒤에는 우승 결과와 기록도 남겨서 다음 공연에서도 이어서 볼 수 있습니다.
      </p>
    </section>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 32px;">
      <a class="setlist-cta" style="flex:1;min-width:220px;margin:0;" href="/OPENMIC/">
        <div><strong>대관공연 일정 보기</strong><small>다가오는 공연과 지난 회차 확인</small></div><span>→</span>
      </a>
      <a class="setlist-cta" style="flex:1;min-width:220px;margin:0;" href="/OPENMIC/?ranking=winner">
        <div><strong>우승 기록 보기</strong><small>누적 우승 기록 확인</small></div><span>→</span>
      </a>
    </div>
  `;
}


function renderMain(){
  document.title='VOM OPEN MIC';
  page.classList.toggle('admin-mode',adminMode);
  const today=new Date();today.setHours(0,0,0,0);
  const list=[...events].sort((a,b)=>String(b.event_date).localeCompare(String(a.event_date)));
  page.innerHTML=`
    <section class="hero">
      <div class="kicker">VOM STAGE · OPEN MIC</div>
      <h1>Open Mic</h1>
      <p>VOM이 직접 대관한 무대에서 관객과 함께 만드는 공연입니다.</p>
    </section>
    <section class="intro">
      <div class="kicker">ABOUT OPEN MIC</div>
      <h2>대관공연은요</h2>
      <p>연습실이나 거리보다 한 단계 더 큰 무대에서 준비한 곡을 관객에게 선보이는 VOM의 공연 컨텐츠입니다. 회차별 컨셉과 프로그램을 만들고, 공연 결과와 우승 기록도 함께 남깁니다.</p>
      <div class="intro-grid">
        <div><strong>정식 공연 무대</strong><small>대관한 공연장에서 관객과 함께</small></div>
        <div><strong>회차별 컨셉</strong><small>테마와 프로그램을 정해 하나의 공연으로</small></div>
        <div><strong>우승 기록</strong><small>대관공연의 우승자를 기록하고 누적</small></div>
      </div>
    </section>
    <div class="section-head"><h2>대관공연 일정</h2><a href="/OPENMIC/?ranking=winner" style="font-size:11px;text-decoration:none;color:#715bc7">우승 기록 보기 →</a></div>
    <div class="list">
      ${list.length?list.map(row=>{
        const d=parseDate(row.event_date),l=loc(row),img=row.image_url||l?.image_url||'',ws=getWinners(row.id);
        return `<a class="card" href="/OPENMIC/?id=${row.id}">
          <div class="datebox"><div><strong>${String(d.getDate()).padStart(2,'0')}</strong><small>${d.getMonth()+1}월 · ${week(row.event_date)}</small></div></div>
          <div><div class="type">OPEN MIC</div><h3>${esc(row.title||'')}</h3><div class="meta">${esc(makeTime(row)||'시간 미정')} · ${esc(l?.name||row.location||'장소 미정')}</div><div class="hint">${ws.length?'🏆 '+ws.map(x=>esc(x.member_name)).join(' · ')+' 우승':'상세 보기 →'}</div></div>
          <div class="thumb">${img?`<img src="${attr(img)}" alt="">`:'OPEN MIC'}</div>
        </a>`;
      }).join(''):'<div class="empty">등록된 대관공연이 없습니다.</div>'}
    </div>`;
}

async function renderDetail(id){
  const row=events.find(x=>String(x.id)===String(id));
  if(!row){page.innerHTML='<div class="empty">대관공연 일정을 찾을 수 없습니다.</div>';return}
  const l=loc(row),img=row.image_url||l?.image_url||'',ws=getWinners(row.id),hasSetlist=await setlistExists(row.id);
  document.title=`${row.title||'OPEN MIC'} · VOM`;
  page.classList.toggle('admin-mode',adminMode);
  page.innerHTML=`
    <a class="back" href="/OPENMIC/">← OPEN MIC</a>
    <section class="detail">
      <div class="type">OPEN MIC</div>
      <h1 class="detail-title">${esc(row.title||'')}</h1>
      ${img?`<div class="detail-image"><img src="${attr(img)}" alt=""></div>`:`<div class="detail-image">Voice of Melody</div>`}
      <div class="detail-meta">
        <div class="info"><small>DATE</small><strong>${esc(fmtDate(row.event_date))}</strong></div>
        <div class="info"><small>TIME</small><strong>${esc(makeTime(row)||'시간 미정')}</strong></div>
        <div class="info"><small>PLACE</small><strong>${esc(l?.name||row.location||'장소 미정')}</strong></div>
      </div>
      ${row.description?`<div class="desc">${esc(row.description).replace(/\n/g,'<br>')}</div>`:''}
      ${ws.length?`<div class="winner-box"><div class="label">OPEN MIC WINNER</div><div class="winner-names">🏆 ${ws.map(x=>esc(x.member_name)).join(' · ')}</div></div>`:''}
      ${hasSetlist
        ? `<a class="setlist-cta" href="/busking/setlist/?id=${row.id}"><div><strong>셋리스트 보기</strong><small>참가자 편성 · 곡 · 최종 공연 순서</small></div><span>→</span></a>`
        : adminMode
          ? `<a class="setlist-cta" href="/busking/setlist/?id=${row.id}&create=1"><div><strong>＋ 셋리스트 추가</strong><small>이 공연에 셋리스트를 만듭니다.</small></div><span>＋</span></a>`
          : ''}
      <div class="admin-actions"><button class="action-btn" onclick="openWinnerEditor(${row.id})">${ws.length?'우승자 수정':'＋ 우승자 입력'}</button></div>
    </section>`;
}

function renderRanking(){
  document.title='대관공연 우승 기록 · VOM';
  const map=new Map();
  winners.forEach(w=>{
    const key=String(w.member_id||w.member_name||'');
    if(!key)return;
    if(!map.has(key))map.set(key,{name:w.member_name||'',wins:0});
    map.get(key).wins++;
  });
  const list=[...map.values()].sort((a,b)=>b.wins-a.wins||a.name.localeCompare(b.name,'ko'));
  let lastWins=null,rank=0;
  const ranked=list.map((x,i)=>{if(x.wins!==lastWins){rank=i+1;lastWins=x.wins}return{...x,rank}});
  page.innerHTML=`
    <a class="back" href="/">← HOME</a>
    <section class="hero">
      <div class="kicker">OPEN MIC · WINNERS</div>
      <h1 class="ranking-title">대관공연 우승 기록</h1>
      <p>VOM 대관공연에서 기록된 우승 횟수를 기준으로 확인합니다.</p>
    </section>
    <div class="ranking-list">
      ${ranked.length?ranked.map(x=>`<div class="rank-row"><div class="rank-no">${x.rank}</div><div><div class="rank-name">${esc(x.name)}</div><div class="rank-detail">누적 대관공연 우승</div></div><div class="rank-score">${x.wins}<small>WIN</small></div></div>`).join(''):'<div class="empty">아직 대관공연 우승 기록이 없습니다.</div>'}
    </div>`;
}

function openWinnerEditor(eventId){
  if(!adminMode)return;
  winnerEventId.value=eventId;
  winnerEditor.innerHTML='';
  const existing=getWinners(eventId);
  if(existing.length)existing.forEach(w=>addWinnerRow(w.member_id));
  else addWinnerRow();
  winnerOverlay.classList.add('open');
}
function closeWinnerEditor(){winnerOverlay.classList.remove('open')}
function addWinnerRow(selected=''){
  const row=document.createElement('div');row.className='winner-row';
  const opts=members.map(m=>`<option value="${attr(m.id)}"${String(m.id)===String(selected)?' selected':''}>${esc(memberLabel(m))}</option>`).join('');
  row.innerHTML=`<select class="field winner-member"><option value="">멤버 선택</option>${opts}</select><button class="remove" onclick="this.parentElement.remove()">×</button>`;
  winnerEditor.appendChild(row);
}
async function saveWinners(){
  if(!adminMode)return;
  const eventId=Number(winnerEventId.value);
  const ids=[...document.querySelectorAll('.winner-member')].map(x=>x.value).filter(Boolean);
  const unique=[...new Set(ids)];
  if(!unique.length){alert('우승자를 선택해주세요.');return}
  const payload=unique.map(id=>{
    const m=members.find(x=>String(x.id)===String(id));
    return {event_id:eventId,member_id:String(id),member_name:m?.name||''};
  });
  const del=await db.from('open_mic_winners').delete().eq('event_id',eventId);
  if(del.error){alert('기존 우승 기록 정리에 실패했습니다.');console.error(del.error);return}
  const ins=await db.from('open_mic_winners').insert(payload);
  if(ins.error){alert('우승 결과 저장에 실패했습니다.');console.error(ins.error);return}
  winners=winners.filter(x=>String(x.event_id)!==String(eventId)).concat(payload);
  closeWinnerEditor();await renderDetail(eventId);
}
function openMenu(){menuOverlay.classList.add('open')}function closeMenu(){menuOverlay.classList.remove('open')}
start();
</script>
</body>
