<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>개인 계정 설정 · VOM</title><link rel="icon" href="/favicon.png?v=4"><link rel="stylesheet" href="/assets/ot-room.css?v=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script><script defer src="/assets/vom-activate.js?v=1"></script></head>
<body class="ot-public"><header class="ot-header"><div class="ot-brand">VOM <small>VOICE OF MELODY</small></div></header>
<main class="ot-page ot-applicant"><h1>개인 계정 설정</h1><div id="activationMessage" class="ot-message" role="status">설정 링크를 확인하고 있습니다.</div>
<section id="activationCard" class="ot-card" hidden><form id="activationForm"><div class="ot-fields">
<label>새 개인 비밀번호<input name="password" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리" required><small>본인만 아는 숫자 4자리로 설정해 주세요.</small></label>
<label>새 비밀번호 확인<input name="confirm_password" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" placeholder="숫자 4자리 다시 입력" required></label>
</div><button class="ot-button ot-primary" type="submit">내 비밀번호 설정</button></form></section>
<p class="ot-note">운영진이 본인에게 전달한 링크에서만 설정할 수 있습니다. 이 링크는 7일 안에 한 번 사용할 수 있습니다.</p><a class="ot-button" href="/me/">MY VOM으로 이동</a></main></body></html>
