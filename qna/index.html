ng:34px 20px;border:1px dashed #dcd7ef;border-radius:20px;text-align:center;color:#81879b;font-size:12px}.toast{position:fixed;left:50%;bottom:28px;z-index:9;max-width:min(420px,calc(100% - 32px));transform:translate(-50%,20px);padding:13px 17px;border-radius:14px;background:#1f2339;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.24s;box-shadow:0 12px 32px rgba(15,18,37,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b34f63}.overlay{position:fixed;inset:0;z-index:15;display:none;align-items:flex-start;justify-content:flex-end;padding:18px;background:rgba(20,20,40,.26);backdrop-filter:blur(5px)}.overlay.open{display:flex}.menu-card{width:min(380px,100%);margin-top:55px;padding:16px;border-radius:24px;background:#fff;box-shadow:0 22px 70px rgba(31,23,79,.2)}.menu-top{display:flex;align-items:center;justify-content:space-between;padding:6px 5px 12px}.menu-top h3{margin:0;font-size:17px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#f3f2f8;color:#4d5264;font-size:16px;cursor:pointer}.menu-card a{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 10px;border-top:1px solid #f0eef6;color:#2c3043;text-decoration:none;font:700 13px "DM Sans",Pretendard,sans-serif}.menu-card a.active{color:#6755d9}.bottom{position:fixed;z-index:8;left:50%;bottom:12px;transform:translateX(-50%);display:none;width:min(500px,calc(100% - 24px));padding:9px;background:rgba(255,255,255,.89);border:1px solid rgba(238,235,247,.9);border-radius:24px;box-shadow:0 15px 36px rgba(57,48,108,.12);backdrop-filter:blur(12px)}.bottom a,.bottom button{flex:1;border:0;background:none;color:#7a8093;text-decoration:none;text-align:center;font:700 9px "DM Sans",Pretendard,sans-serif}.bottom span{display:block;margin-bottom:4px;font-size:17px;color:#6b5bda}

const SUPABASE_URL='https://aqfmhqultzpakfqwzulj.supabase.co';

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const fixedFaq=[
  ['참가 신청은 어디서 하나요?','일정별 소모임 공지에서 참가를 신청해 주세요. 일정과 인원, 세부 안내는 해당 공지를 기준으로 확인하면 가장 정확합니다.'],
  ['버스킹 MR과 촬영은 어떻게 준비하나요?','버스킹은 현장·곡·가창자마다 음량 조건이 달라요. 개인 MR을 사용할 때는 반주가 충분히 들리도록 최대 볼륨으로 녹음하거나 다른 MR과 비교해 확인해 주세요. 개인 영상은 현장 컨디션에 따라 퀄리티를 보장하기 어려워 본인이 직접 챙겨 주시면 좋습니다.'],

  ['익명 문의는 어떻게 보이나요?','익명으로 남기기를 선택하면 공개 FAQ에서는 작성자 이름이 보이지 않습니다. 다만 운영진이 답변과 후속 안내를 위해 작성 회원은 확인할 수 있습니다.']

let session=null,myMember=null,isAdmin=false,myQuestions=[],allQuestions=[],publishedQuestions=[],memberMap={},memberOptions=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(message,isError=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast show'+(isError?' error':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3400)}
function fmt(date){if(!date)return '';const d=new Date(date);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function emailFor(id){return 'member-'+Number(id)+'@member.thisisvom.app'}
function authPassword(value){return 'VOM:'+String(value??'')}
async function signInMember(memberId,password){const email=emailFor(memberId);let result=await db.auth.signInWithPassword({email,password:authPassword(password)});if(!result.error)return result;return db.auth.signInWithPassword({email,password})}
function memberSelectHtml(id){return '<select id="'+id+'"><option value="">등록된 회원 선택</option>'+memberOptions.map(m=>'<option value="'+m.id+'">'+esc(m.name||m.nickname||'이름 미등록')+'</option>').join('')+'</select>'}
async function invokeAccount(body){const {data,error}=await db.functions.invoke('member-account',{body});if(error)throw new Error(data?.error||error.message||'계정 정보를 확인하지 못했습니다.');if(data?.error)throw new Error(data.error);return data}
function answersOf(q){const a=q.vom_qna_answers;return Array.isArray(a)?a:(a?[a]:[])}
function statusLabel(v){return v==='답변완료'?'<span class="pill">답변완료</span>':v==='보류'?'<span class="pill hold">보류</span>':'<span class="pill wait">답변 대기</span>'}
function faqMarkup(title,body,tag='VOM FAQ'){return '<details class="faq"><summary><span class="tag">'+esc(tag)+'</span><span>'+esc(title)+'</span></summary><div class="faq-answer"><p>'+esc(body).replace(/\n/g,'<br>')+'</p></div></details>'}
function questionMarkup(q,admin=false){const a=answersOf(q)[0];const author=memberMap[q.member_id]||'알 수 없음';return '<article class="question"><div class="question-head"><div><h3 class="question-title">'+esc(q.title)+'</h3><div class="meta">'+esc(q.category||'기타')+' · '+fmt(q.created_at)+(admin?' · 작성자: '+esc(author)+(q.is_anonymous?' (익명 공개)':''):'')+'</div></div>'+statusLabel(q.status)+'</div><div class="question-content">'+esc(q.content).replace(/\n/g,'<br>')+'</div>'+(a?'<div class="answer"><b>VOM 운영진 답변</b>'+esc(a.content).replace(/\n/g,'<br>')+'</div>':'')+(admin?'<div class="admin-card"><b style="font-size:11px">운영 답변</b><textarea id="answer-'+q.id+'" placeholder="회원에게 전달할 답변을 작성해 주세요.">'+esc(a?.content||'')+'</textarea><div class="admin-actions"><label><input id="public-'+q.id+'" type="checkbox" '+(q.is_public?'checked':'')+'> 공개 FAQ에 함께 표시</label><button class="small-btn" onclick="saveAnswer('+q.id+')">답변 저장</button></div></div>':'')+'</article>'}

function renderFixedFaq(){document.getElementById('fixedFaq').innerHTML=fixedFaq.map(([q,a])=>faqMarkup(q,a)).join('')}
function renderPublished(){const el=document.getElementById('publishedFaq');if(!publishedQuestions.length){el.innerHTML='<div class="empty">아직 공개된 운영 답변이 없습니다.</div>';return}el.innerHTML=publishedQuestions.map(q=>{const a=answersOf(q)[0];return faqMarkup(q.title,a?.content||q.content,q.is_anonymous?'익명 문의':'회원 문의')}).join('')}
function renderMy(){const el=document.getElementById('myQnaSection');if(!myMember){el.innerHTML='<div class="section-head"><h2>문의하기</h2></div><div class="card login-cta"><h3>회원 선택 후 바로 문의할 수 있어요</h3><p>등록된 회원을 선택하고 4자리 이상 개인 비밀번호를 확인하면 문의 작성 화면이 열립니다. 처음이라면 MY VOM에서 개인 설정을 먼저 해 주세요.</p><div class="form-grid"><div class="field"><label>회원 선택</label>'+memberSelectHtml('qnaLoginMember')+'</div><div class="field"><label>개인 비밀번호 (4자리 이상)</label><input id="qnaLoginPassword" type="password" autocomplete="current-password" placeholder="4자리 이상 개인 비밀번호"></div></div><button id="qnaLoginButton" class="primary" onclick="loginForQna()">회원 확인 후 문의하기</button><a class="soft-btn" href="/me/" style="margin-top:12px">처음 설정하기 / 비밀번호 힌트 보기 →</a></div>';return}el.innerHTML='<div class="section-head"><h2>문의하기</h2><p>'+esc(myMember.name||'회원')+'님으로 작성</p></div><div class="card"><div class="notice"><b>작성 전 확인</b><span>문의 등록 시 4자리 이상 개인 비밀번호를 한 번 더 확인합니다. 익명을 선택하면 공개 FAQ에서는 이름이 보이지 않아요.</span></div><div class="form-grid"><div class="field"><label>분류</label><select id="qnaCategory"><option>일정·참가</option><option>버스킹·셋리스트</option><option>회비·환불</option><option>계정·홈페이지</option><option>기타</option></select></div><div class="field"><label>제목</label><input id="qnaTitle" maxlength="120" placeholder="궁금한 내용을 한 줄로 적어 주세요"></div></div><div class="field"><label>내용</label><textarea id="qnaContent" maxlength="3000" placeholder="상황과 궁금한 점을 편하게 적어 주세요."></textarea></div><label class="check"><input id="qnaAnonymous" type="checkbox"> 익명으로 남기기</label><p class="help">익명이어도 운영진은 답변과 후속 안내를 위해 작성 회원을 확인할 수 있습니다.</p><div class="field"><label>개인 비밀번호 확인 (4자리 이상)</label><input id="qnaPassword" type="password" autocomplete="current-password" placeholder="등록한 4자리 이상 개인 비밀번호"></div><button id="qnaSubmit" class="primary" onclick="submitQuestion()">문의 등록</button></div><div class="section-head" style="margin-top:28px"><h2>내 문의</h2><p>답변은 이곳에서 확인해요</p></div><div class="questions">'+(myQuestions.length?myQuestions.map(q=>questionMarkup(q)).join(''):'<div class="empty">아직 남긴 문의가 없습니다.</div>')+'</div>'}
function renderAdmin(){const el=document.getElementById('adminQnaSection');if(!isAdmin){el.innerHTML='';return}el.innerHTML='<div class="section-head"><h2>운영진 Q&A 관리</h2><p>답변 후 필요하면 공개 FAQ로 전환</p></div><div class="questions">'+(allQuestions.length?allQuestions.map(q=>questionMarkup(q,true)).join(''):'<div class="empty">등록된 문의가 없습니다.</div>')+'</div>'}

async function loadSession(){const {data}=await db.auth.getSession();session=data.session||null;myMember=null;isAdmin=false;if(!session)return;const [account,adminResult]=await Promise.all([invokeAccount({action:'whoami'}),db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle()]);if(adminResult.error)throw adminResult.error;myMember=account.member||null;isAdmin=!!adminResult.data}
async function loginForQna(){const memberId=document.getElementById('qnaLoginMember').value;const password=document.getElementById('qnaLoginPassword').value;if(!memberId||!password)return say('회원과 개인 비밀번호를 입력해 주세요.',true);const btn=document.getElementById('qnaLoginButton');btn.disabled=true;btn.textContent='확인 중...';try{const {error}=await signInMember(memberId,password);if(error)throw new Error('회원 또는 개인 비밀번호를 다시 확인해 주세요.');await loadSession();if(!myMember)throw new Error('개인 설정이 완료된 회원만 문의를 작성할 수 있어요.');await loadQuestions();renderMy();renderAdmin();say((myMember.name||'회원')+'님, 문의를 작성해 주세요.')}catch(error){say(error.message||'회원 정보를 확인하지 못했습니다.',true)}finally{const b=document.getElementById('qnaLoginButton');if(b){b.disabled=false;b.textContent='회원 확인 후 문의하기'}}}
async function loadMemberMap(){const {data,error}=await db.from('members_public').select('id,name,nickname,join_order').order('join_order',{ascending:true});if(error)throw error;memberOptions=data||[];memberMap=Object.fromEntries(memberOptions.map(m=>[m.id,m.name||m.nickname||'회원']))}
async function queryQuestions(filter){const {data,error}=await db.from('vom_qna_questions').select('id,member_id,category,title,content,status,is_public,is_anonymous,created_at,vom_qna_answers(id,content,is_public,created_at)').match(filter).order('created_at',{ascending:false});if(error)throw error;return data||[]}
async function loadQuestions(){publishedQuestions=await queryQuestions({is_public:true,status:'답변완료'});if(myMember)myQuestions=await queryQuestions({member_id:myMember.id});else myQuestions=[];if(isAdmin){const {data,error}=await db.from('vom_qna_questions').select('id,member_id,category,title,content,status,is_public,is_anonymous,created_at,vom_qna_answers(id,content,is_public,created_at)').order('created_at',{ascending:false});if(error)throw error;allQuestions=data||[]}else allQuestions=[]}
async function submitQuestion(){if(!myMember)return;const category=document.getElementById('qnaCategory').value;const title=document.getElementById('qnaTitle').value.trim();const content=document.getElementById('qnaContent').value.trim();const password=document.getElementById('qnaPassword').value;const anonymous=document.getElementById('qnaAnonymous').checked;if(!title||!content||!password)return say('제목, 내용, 개인 비밀번호를 모두 입력해 주세요.',true);const btn=document.getElementById('qnaSubmit');btn.disabled=true;btn.textContent='등록 중...';try{const {error:loginError}=await signInMember(myMember.id,password);if(loginError)throw new Error('개인 비밀번호를 다시 확인해 주세요.');const {error}=await db.from('vom_qna_questions').insert({member_id:myMember.id,category,title,content,is_anonymous:anonymous});if(error)throw error;await loadQuestions();renderMy();renderAdmin();say('문의가 등록됐어요. 운영진 답변을 기다려 주세요.')}catch(error){say(error.message||'문의를 등록하지 못했습니다.',true)}finally{const b=document.getElementById('qnaSubmit');if(b){b.disabled=false;b.textContent='문의 등록'}}}
async function saveAnswer(id){if(!isAdmin)return;const content=document.getElementById('answer-'+id).value.trim();const isPublic=document.getElementById('public-'+id).checked;if(!content)return say('답변 내용을 입력해 주세요.',true);try{const q=allQuestions.find(x=>String(x.id)===String(id));const existing=answersOf(q)[0];let error;if(existing){({error}=await db.from('vom_qna_answers').update({content,is_public:isPublic,admin_user_id:session.user.id}).eq('id',existing.id))}else{({error}=await db.from('vom_qna_answers').insert({question_id:id,admin_user_id:session.user.id,content,is_public:isPublic}))}if(error)throw error;const {error:questionError}=await db.from('vom_qna_questions').update({status:'답변완료',is_public:isPublic}).eq('id',id);if(questionError)throw questionError;await loadQuestions();renderPublished();renderMy();renderAdmin();say('답변을 저장했어요.')}catch(error){say(error.message||'답변을 저장하지 못했습니다.',true)}}
function openMenu(){const el=document.getElementById('menuOverlay');el.classList.add('open');el.setAttribute('aria-hidden','false')}function closeMenu(){const el=document.getElementById('menuOverlay');el.classList.remove('open');el.setAttribute('aria-hidden','true')}document.getElementById('menuOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
(async()=>{try{await loadSession();await Promise.all([loadMemberMap(),loadQuestions()]);renderFixedFaq();renderPublished();renderMy();renderAdmin()}catch(error){document.getElementById('myQnaSection').innerHTML='<div class="empty">Q&A를 불러오지 못했습니다.<br><br>'+esc(error.message||'잠시 후 다시 시도해 주세요.')+'</div>'}})();
</script>
