# ot-room authenticates a per-applicant secret invite; ot-review validates each
# user's JWT with Auth and checks the existing admin / active operator records.
# Publishable keys are not JWTs, so gateway JWT checks are intentionally disabled.
[functions.ot-room]
verify_jwt = false

[functions.ot-review]
verify_jwt = false

# Preserve the existing cron-secret authentication in this pre-existing handler.
[functions.admin-reminder-push]
verify_jwt = false

# Custom Auth.getUser checks protect membership; login/one-use activation are public.
[functions.vom-access]
verify_jwt = false

[functions.member-account]
verify_jwt = false

[functions.public-events]
verify_jwt = false
