<script>
const SUPABASE_URL='https://aqfmhqultzpakfqwzulj.supabase.co';
const SUPABASE_KEY='sb_publishable_PfwvwgO6402LfeqLPbUBgg_2bCwaX4R';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
let members=[],session=null,myMember=null,accountSetting=null;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(message,isError=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast show'+(isError?' error':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3400)}
function accountEmail(id){return 'member-'+Number(id)+'@member.thisisvom.app'}
function authPassword(value){return 'VOM:'+String(value??'')}
async function signInMember(memberId,password){const email=accountEmail(memberId);let result=await db.auth.signInWithPassword({email,password:authPassword(password)});if(!result.error)return result;return db.auth.signInWithPassword({email,password})}
function selectHtml(id){return '<select id="'+id+'"><option value="">등록된 회원 선택</option>'+members.map(m=>'<option value="'+m.id+'">'+esc(m.name||m.nickname||'이름 미등록')+(m.region?' · '+esc(m.region):'')+'</option>').join('')+'</select>'}
function memberName(id){const m=members.find(x=>String(x.id)===String(id));return m?(m.name||m.nickname||'회원'):''}

async function invokeAccount(body){const {data,error}=await db.functions.invoke('member-account',{body});if(error){let message=error.message||'요청을 처리하지 못했습니다.';try{const text=await error.context?.text?.();const parsed=JSON.parse(text);message=parsed.error||message}catch(_){ }throw new Error(message)}if(data?.error)throw new Error(data.error);return data}

async function loadSession(){const {data}=await db.auth.getSession();session=data.session||null;myMember=null;accountSetting=null;if(!session)return;const account=await invokeAccount({action:'whoami'});myMember=account.member||null;if(myMember){const {data:setting,error:settingError}=await db.from('member_account_settings').select('password_hint,must_change_password,password_changed_at').eq('member_id',myMember.id).maybeSingle();if(settingError)throw settingError;accountSetting=setting||null}}
function render(){if(myMember)renderDashboard();else renderWelcome()}

function renderWelcome(){app.innerHTML='<details class="first-setup first-setup-entry"><summary><div><b>MY VOM이 처음이신가요?</b><span>처음 한 번만 개인 설정을 완료해 주세요.</span></div><i>+</i></summary><div class="first-setup-body"><p class="card-intro">공통 비밀번호를 확인하고, 나만의 비밀번호와 힌트를 설정해 주세요.</p><div class="initial"><div class="initial-main"><span>공통 최초 비밀번호</span><code>0000</code></div><span class="initial-help">회원 선택 후 아래 입력란에 입력해 주세요.</span></div><div class="setup-grid"><div class="field"><label>회원 선택</label>'+selectHtml('setupMember')+'</div><div class="field"><label>공통 비밀번호 확인</label><input id="setupInitial" type="password" inputmode="numeric" maxlength="4" placeholder="공통 비밀번호 입력"></div><div class="field"><label>새 비밀번호 (4자리 이상)</label><input id="setupPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="4자리 이상 입력"></div><div class="field"><label>새 비밀번호 확인</label><input id="setupPasswordConfirm" type="password" autocomplete="new-password" maxlength="64" placeholder="한 번 더 입력"></div><div class="field wide"><label>비밀번호 힌트 <em style="font-style:normal;color:#9b9fb0;font-weight:500">(선택)</em></label><input id="setupHint" maxlength="100" placeholder="예: 처음 함께 부른 곡"><p class="help">비밀번호 자체나 생일·전화번호처럼 추측하기 쉬운 정보는 적지 마세요.</p></div></div><button id="setupButton" class="primary" onclick="setupAccount()">개인 설정 시작</button></div></details><section class="card login-main"><h2>MY VOM 들어가기 <span class="en">LOGIN</span></h2><p class="card-intro">등록된 회원과 4자리 이상 개인 비밀번호로 내 MY SETLIST와 문의를 이어서 확인할 수 있어요.</p><div class="login-fields"><div class="field"><label>회원 선택</label>'+selectHtml('loginMember')+'</div><div class="field"><label>개인 비밀번호 (4자리 이상)</label><input id="loginPassword" type="password" autocomplete="current-password" maxlength="64" placeholder="4자리 이상 개인 비밀번호"></div></div><button id="loginButton" class="primary" onclick="loginAccount()">MY VOM 들어가기</button><button class="line-btn" onclick="showHint()">비밀번호 힌트 보기</button><div id="hintBox" class="hint-box"></div><p class="account-note">비밀번호를 잊었는데 힌트로도 해결되지 않으면 운영진에게 초기화를 요청해 주세요. 운영진이 <b>0000</b>으로 초기화해 드립니다.</p></section>'}function renderDashboard(){const force=accountSetting?.must_change_password;app.innerHTML=(force?'<div class="force-reset"><b>비밀번호 재설정이 필요해요.</b>운영진이 비밀번호를 <b style="display:inline">0000</b>으로 초기화했습니다. 아래에서 나만 아는 비밀번호로 바꿔 주세요.</div>':'')+'<div class="status"><b>MY VOM</b><span><strong>'+esc(myMember.name||myMember.nickname||'회원')+'</strong>님으로 로그인되어 있어요. 필요한 내용을 직접 관리해 주세요.</span></div><div class="dash-grid"><section class="card dash-card"><h2>내 프로필 <span class="en">PROFILE</span></h2><div class="member-chip"><i class="member-dot"></i>'+esc(myMember.name||myMember.nickname||'회원')+(myMember.region?' · '+esc(myMember.region):'')+'</div><p class="card-intro">좋아하는 가수와 직업만 직접 수정할 수 있어요.</p><div class="profile-row"><div class="field"><label>좋아하는 가수</label><input id="profileFavorite" value="'+esc(myMember.favorite_singers||'')+'" placeholder="예: 박효신"></div><div class="field"><label>직업</label><input id="profileJob" value="'+esc(myMember.job||'')+'" placeholder="예: 삐에로"></div></div><button class="primary" onclick="saveProfile()">프로필 저장</button></section><section class="card dash-card"><h2>내 활동 <span class="en">MY SPACE</span></h2><p class="card-intro">내가 작성할 수 있는 공간만 바로 연결했어요.</p><div class="quick-links"><a class="quick-link" href="/members/?mine=1"><div><b>MY SETLIST</b><small>내 개인곡과 참고 파일 관리</small></div><span>→</span></a><a class="quick-link" href="/qna/?mine=1"><div><b>내 문의 / Q&A</b><small>궁금한 내용 남기고 답변 확인</small></div><span>→</span></a></div></section><section class="card"><h2>비밀번호 변경 <span class="en">SECURITY</span></h2><p class="card-intro">기억하기 쉬운 4자리 이상 개인 비밀번호로 관리해 주세요.</p><div class="profile-row"><div class="field"><label>새 비밀번호 (4자리 이상)</label><input id="newPassword" type="password" autocomplete="new-password" maxlength="64" placeholder="4자리 이상 입력"></div><div class="field"><label>새 비밀번호 확인</label><input id="newPasswordConfirm" type="password" autocomplete="new-password" maxlength="64" placeholder="한 번 더 입력"></div></div><div class="field"><label>새 비밀번호 힌트 <em style="font-style:normal;color:#9b9fb0;font-weight:500">(선택)</em></label><input id="newHint" maxlength="100" value="'+esc(accountSetting?.password_hint||'')+'" placeholder="예: 처음 함께 부른 곡"><p class="help">비밀번호 자체나 생일·전화번호는 적지 마세요.</p></div><button class="primary" onclick="changePassword()">비밀번호 저장</button><button class="logout" onclick="logout()">로그아웃</button></section><section class="card"><h2>운영진 초기화 안내 <span class="en">RESET</span></h2><p class="card-intro">비밀번호가 기억나지 않을 때는 운영진에게 연락해 주세요.</p><div class="initial"><span>초기화 비밀번호</span><code>0000</code></div><p class="account-note">초기화 후에는 이 페이지에서 다시 나만 아는 비밀번호와 힌트를 설정하면 됩니다.</p></section></div>'}

async function setupAccount(){const memberId=document.getElementById('setupMember').value;const initial=document.getElementById('setupInitial').value;const password=document.getElementById('setupPassword').value;const confirm=document.getElementById('setupPasswordConfirm').value;const hint=document.getElementById('setupHint').value;if(!memberId)return say('회원을 선택해 주세요.',true);if(password.length<4||password.length>64)return say('새 비밀번호는 4~64자로 입력해 주세요.',true);if(password!==confirm)return say('새 비밀번호 확인이 일치하지 않습니다.',true);const btn=document.getElementById('setupButton');btn.disabled=true;btn.textContent='개인 설정 중...';try{const data=await invokeAccount({action:'setup',member_id:memberId,initial_password:initial,new_password:password,password_hint:hint});const {error}=await db.auth.signInWithPassword({email:data.login_email,password:authPassword(password)});if(error)throw error;await loadSession();render();say((data.member_name||memberName(memberId))+'님, 개인 설정이 완료됐어요.')}catch(error){say(error.message||'개인 설정을 완료하지 못했습니다.',true)}finally{const b=document.getElementById('setupButton');if(b){b.disabled=false;b.textContent='개인 설정 시작'}}}
async function loginAccount(){const memberId=document.getElementById('loginMember').value;const password=document.getElementById('loginPassword').value;if(!memberId||!password)return say('회원과 개인 비밀번호를 입력해 주세요.',true);const btn=document.getElementById('loginButton');btn.disabled=true;btn.textContent='확인 중...';try{const {error}=await signInMember(memberId,password);if(error)throw new Error('회원 또는 개인 비밀번호를 다시 확인해 주세요.');await loadSession();render();say((myMember?.name||'회원')+'님, 반가워요!')}catch(error){say(error.message||'로그인하지 못했습니다.',true)}finally{const b=document.getElementById('loginButton');if(b){b.disabled=false;b.textContent='MY VOM 들어가기'}}}
async function showHint(){const memberId=document.getElementById('loginMember').value;if(!memberId)return say('힌트를 볼 회원을 먼저 선택해 주세요.',true);const box=document.getElementById('hintBox');box.classList.add('show');box.textContent='힌트를 불러오는 중...';try{const data=await invokeAccount({action:'hint',member_id:memberId});box.textContent=data.hint?'힌트: '+data.hint:data.message||'등록된 힌트가 없습니다.'}catch(error){box.textContent=error.message||'힌트를 불러오지 못했습니다.'}}
async function saveProfile(){if(!myMember)return;const favorite=document.getElementById('profileFavorite').value.trim();const job=document.getElementById('profileJob').value.trim();const {error}=await db.from('members').update({favorite_singers:favorite||null,job:job||null}).eq('id',myMember.id);if(error)return say(error.message||'프로필을 저장하지 못했습니다.',true);myMember.favorite_singers=favorite;myMember.job=job;say('프로필을 저장했어요.')}
async function changePassword(){const password=document.getElementById('newPassword').value;const confirm=document.getElementById('newPasswordConfirm').value;const hint=document.getElementById('newHint').value.trim();if(password.length<4||password.length>64)return say('새 비밀번호는 4~64자로 입력해 주세요.',true);if(password!==confirm)return say('새 비밀번호 확인이 일치하지 않습니다.',true);const {error}=await db.auth.updateUser({password:authPassword(password)});if(error)return say(error.message||'비밀번호를 바꾸지 못했습니다.',true);const {error:settingError}=await db.from('member_account_settings').update({password_hint:hint||null,must_change_password:false,password_changed_at:new Date().toISOString()}).eq('member_id',myMember.id);if(settingError)return say(settingError.message||'힌트를 저장하지 못했습니다.',true);accountSetting={...(accountSetting||{}),password_hint:hint,must_change_password:false};render();say('개인 비밀번호를 저장했어요.')}
async function logout(){await db.auth.signOut();session=null;myMember=null;accountSetting=null;render();say('로그아웃했어요.')}
function openMenu(){const el=document.getElementById('menuOverlay');el.classList.add('open');el.setAttribute('aria-hidden','false')}
function closeMenu(){const el=document.getElementById('menuOverlay');el.classList.remove('open');el.setAttribute('aria-hidden','true')}
document.getElementById('menuOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
(async()=>{try{await loadMembers();await loadSession();render()}catch(error){app.innerHTML='<div class="empty">개인 설정을 불러오지 못했습니다.<br><br>'+esc(error.message||'잠시 후 다시 시도해 주세요.')+'</div>'}})();
</script>
