function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(message,isError=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast show'+(isError?' error':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.className='toast',3400)}

function memberName(id){const m=members.find(x=>String(x.id)===String(id));return m?(m.name||m.nickname||'회원'):''}

async function invokeAccount(body){const {data,error}=await db.functions.invoke('member-account',{body});if(error){let message=error.message||'요청을 처리하지 못했습니다.';try{const text=await error.context?.text?.();const parsed=JSON.parse(text);message=parsed.error||message}catch(_){ }throw new Error(message)}if(data?.error)throw new Error(data.error);return data}

async function loadSession(){
 const {data}=await db.auth.getSession();session=data.session||null;myMember=null;accountSetting=null;mySongs=[];editingMySongId=null;if(!session)return;
 let context;try{context=await requestAccess({action:'context'},session.access_token);}catch(error){if(error.status===401||error.status===403){await db.auth.signOut({scope:'local'});session=null;return;}throw error;}
 if(context.state==='PENDING'){await db.auth.signOut({scope:'local'});session=null;return;}
 if(!['APPROVED','PASSWORD_CHANGE_REQUIRED'].includes(context.state))return;
 const account=await invokeAccount({action:'whoami'});myMember=account.member||null;
 if(myMember){const {data:setting,error}=await db.from('member_account_settings').select('password_hint,must_change_password,password_changed_at').eq('member_id',myMember.id).maybeSingle();if(error)throw error;accountSetting=setting||null;}
}

async function loadLoginMembers(){const {data,error}=await db.from('members_display').select('id,name,nickname').eq('is_active',true).order('join_order',{ascending:true});if(error)throw new Error('회원 목록을 불러오지 못했습니다. 잠시 후 다시 시도하거나 가입 아이디로 로그인해 주세요.');loginMembers=data||[];loginMembersError='';}

 loginMode=mode;try{localStorage.setItem('vom-login-mode',mode);}catch(_){}const member=mode==='MEMBER';document.getElementById('memberLoginPanel').hidden=!member;document.getElementById('idLoginPanel').hidden=member;
 document.getElementById('loginNameSearch').disabled=!member;document.getElementById('loginNameSearch').required=member;document.getElementById('loginName').disabled=member;document.getElementById('loginName').required=!member;

function pickerMatches(){const query=document.getElementById('loginNameSearch').value.trim().replace(/\s+/g,'').toLowerCase();return loginMembers.filter(member=>[member.name,member.nickname].some(name=>String(name||'').replace(/\s+/g,'').toLowerCase().includes(query)));}

function drawMemberPicker(){
 const input=document.getElementById('loginNameSearch'),list=document.getElementById('loginMemberOptions');const matches=pickerMatches();pickerIndex=-1;
 list.innerHTML=matches.length?matches.map(member=>`<button type="button" role="option" tabindex="-1" id="login-option-${Number(member.id)}" data-member="${Number(member.id)}" aria-selected="false"><strong>${esc(member.name||member.nickname)}</strong>${member.nickname&&member.nickname!==member.name?`<small>${esc(member.nickname)}</small>`:''}</button>`).join(''):`<p class="picker-empty">${esc(loginMembersError||'검색한 이름이 없습니다.')}</p>`;

function bindMemberPicker(){
 const input=document.getElementById('loginNameSearch'),list=document.getElementById('loginMemberOptions'),picker=document.getElementById('loginMemberPicker');
 document.getElementById('memberPickerNote').textContent=loginMembersError||'이름을 검색하거나 목록에서 선택해 주세요.';
 input.addEventListener('focus',drawMemberPicker);input.addEventListener('input',()=>{document.getElementById('loginMemberId').value='';drawMemberPicker();loginNotice('');});
 document.getElementById('memberPickerToggle').addEventListener('click',()=>{if(list.hidden){input.focus();drawMemberPicker();}else closeMemberPicker();});
 list.addEventListener('pointerdown',event=>event.preventDefault());list.addEventListener('click',event=>{const option=event.target.closest('[data-member]');if(option){chooseLoginMember(option.dataset.member);document.getElementById('loginPassword').focus();}});
 input.addEventListener('keydown',event=>{const matches=pickerMatches();if(event.key==='Escape'){event.preventDefault();closeMemberPicker();return;}if(event.key==='Tab'){closeMemberPicker();return;}
   if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(list.hidden)drawMemberPicker();if(!matches.length)return;pickerIndex=(pickerIndex+(event.key==='ArrowDown'?1:-1)+matches.length)%matches.length;const options=list.querySelectorAll('[role="option"]');options.forEach((option,index)=>option.setAttribute('aria-selected',String(index===pickerIndex)));input.setAttribute('aria-activedescendant',options[pickerIndex].id);options[pickerIndex].scrollIntoView({block:'nearest'});}
   if(event.key==='Enter'&&!list.hidden&&pickerIndex>=0){event.preventDefault();chooseLoginMember(matches[pickerIndex].id);document.getElementById('loginPassword').focus();}
 });
 document.onpointerdown=event=>{if(picker.isConnected&&!picker.contains(event.target))closeMemberPicker();};
}
async function requestAccess(body,token){

 const data=await response.json();if(!response.ok)throw Object.assign(new Error(data.error||'로그인 정보를 확인하지 못했습니다.'),{status:response.status});return data;
}

function mySongReferenceUrl(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  try{
    const url=new URL(raw);
    return ['https:','http:'].includes(url.protocol)?url.href:'';
  }catch(_error){return ''}
}
function mySongIssues(song){
  const issues=[];
  if(!String(song?.song_title||'').trim())issues.push('곡명');
  if(!String(song?.artist_name||'').trim())issues.push('원곡 가수');
  const hasLink=!!mySongReferenceUrl(song?.youtube_url);
  const hasFile=!!mySongReferenceUrl(song?.file_url);
  if(!hasLink&&!hasFile)issues.push('재생 링크 또는 파일');
  else if(hasLink&&hasFile)issues.push('재생 자료 하나만 선택');
  return issues;
}
function mySongReferenceButtons(song){
  const link=mySongReferenceUrl(song?.youtube_url);
  const file=mySongReferenceUrl(song?.file_url);
  return (link?'<a class="song-ref" href="'+esc(link)+'" target="_blank" rel="noopener">링크 열기 ↗</a>':'')+
    (file?'<a class="song-ref" href="'+esc(file)+'" target="_blank" rel="noopener">파일 열기 ↗</a>':'');
}
function mySongRowMarkup(song){
  const issues=mySongIssues(song);
  const hasLink=!!mySongReferenceUrl(song?.youtube_url);
  const hasFile=!!mySongReferenceUrl(song?.file_url);
  const refs=[hasLink?'재생 링크':'',hasFile?(song.file_name?'첨부 · '+song.file_name:'파일 첨부'):''].filter(Boolean).join(' · ')||'재생 자료 없음';
  const duet=song.duet_name?' · 듀엣 '+esc(song.duet_name):'';
  const warning=issues.length?'<span class="song-warning">⚠ 수정 필요</span><p class="song-issues">필수 항목 확인: '+esc(issues.join(' · '))+'</p>':'';
  return '<article class="my-song-row'+(issues.length?' is-incomplete':'')+'"><div class="my-song-copy"><div class="my-song-title-line"><strong>'+esc(song.song_title||'곡명 미입력')+(song.artist_name?' · '+esc(song.artist_name):'')+'</strong>'+warning+'</div><small>'+duet+esc(refs)+'</small></div><div class="my-song-actions">'+mySongReferenceButtons(song)+'<button type="button" class="song-action" onclick="editMySong('+Number(song.id)+')">'+(issues.length?'수정하기':'수정')+'</button></div></article>';
}
function mySetlistMarkup(){
  const editing=setlistEditorOpen&&editingMySongId?mySongs.find(song=>String(song.id)===String(editingMySongId)):null;
  const editingIssues=editing?mySongIssues(editing):[];
  const issueCount=mySongs.filter(song=>mySongIssues(song).length).length;
  const type=editing?.youtube_url?'link':editing?.file_url?'file':'';
  const list=mySongs.length?mySongs.map(mySongRowMarkup).join(''):'<div class="my-song-empty">아직 저장한 개인곡이 없어요.<br>오른쪽의 셋리스트 만들기를 눌러 첫 곡을 등록해 주세요.</div>';
  const fileHelp=editing?.file_name?'현재 첨부: '+esc(editing.file_name)+' · 새 파일을 고르면 교체돼요.':'카카오톡 음성(M4A · AMR · 3GP 포함), MR, 악보 PDF 가능 · 파일당 50MB 이하';
  const duetOptions=members.filter(member=>String(member.id)!==String(myMember?.id)).map(member=>'<option value="'+esc(member.name||member.nickname||'')+'"></option>').join('');
  const titleClass=editing&&!String(editing.song_title||'').trim()?' needs-attention':'';
  const artistClass=editing&&!String(editing.artist_name||'').trim()?' needs-attention':'';
  const referenceClass=editing&&editingIssues.some(issue=>issue==='재생 링크 또는 파일'||issue==='재생 자료 하나만 선택')?' needs-attention':'';
  const editor=setlistEditorOpen?
    '<div class="my-song-form" id="mySongEditor"><div class="my-song-form-top"><h3>'+(editing?'개인곡 수정':'새 개인곡 추가')+'</h3><span>필수 항목을 모두 채워야 저장돼요.</span></div>'+
    (editingIssues.length?'<p class="editor-warning">이 곡은 '+esc(editingIssues.join(' · '))+' 항목을 확인해야 저장할 수 있어요.</p>':'')+
    '<div class="my-song-grid"><div class="field'+titleClass+'"><label>곡명 <span style="color:#dc7430;font-size:9px">필수</span></label><input id="mySongTitle" maxlength="120" required value="'+esc(editing?.song_title||'')+'" placeholder="예: 기억을 걷는 시간"></div><div class="field'+artistClass+'"><label>원곡 가수 <span style="color:#dc7430;font-size:9px">필수</span></label><input id="mySongArtist" maxlength="120" required value="'+esc(editing?.artist_name||'')+'" placeholder="예: 넬"></div><div class="field wide"><label>듀엣 상대 <em style="font-style:normal;color:#9b9fb0;font-weight:500">(선택)</em></label><input id="mySongDuet" maxlength="100" list="mySongMemberOptions" value="'+esc(editing?.duet_name||'')+'" placeholder="이름을 입력하거나 목록에서 선택"><datalist id="mySongMemberOptions">'+duetOptions+'</datalist></div><div class="field wide'+referenceClass+'"><label>재생 자료 <span style="color:#dc7430;font-size:9px">필수</span></label><div class="reference-choice"><label><input name="mySongReferenceType" type="radio" value="link"'+(type==='link'?' checked':'')+' onchange="updateMySongReferenceType()"> 링크 입력</label><label><input name="mySongReferenceType" type="radio" value="file"'+(type==='file'?' checked':'')+' onchange="updateMySongReferenceType()"> 파일 첨부</label></div><small class="reference-guide">재생 링크 또는 파일 첨부 중 하나만 선택해 주세요. 저장 후에는 꼭 직접 열어 확인해 주세요.</small></div><div id="mySongYoutubeField" class="field wide"'+(type==='link'?'':' hidden')+'><label>재생 링크 <span style="color:#dc7430;font-size:9px">필수</span></label><input id="mySongYoutube" inputmode="url" value="'+esc(editing?.youtube_url||'')+'" placeholder="https://youtube.com/..."></div><div id="mySongFileField" class="field wide"'+(type==='file'?'':' hidden')+'><label>MR · 음성 · 참고 파일 <span style="color:#dc7430;font-size:9px">필수</span></label><input id="mySongFile" type="file" accept=".mp3,.m4a,.mp4,.aac,.amr,.wav,.ogg,.opus,.flac,.3gp,.webm,.pdf"><small id="mySongFileHelp" class="my-file-help">'+fileHelp+'</small></div></div><div class="my-song-form-actions"><button type="button" class="primary" onclick="saveMySong()">'+(editing?'개인곡 수정 저장':'개인곡 저장')+'</button><button type="button" class="cancel-song" onclick="cancelMySongEdit()">취소</button>'+(editing?'<button type="button" class="delete-editor" onclick="deleteMySong('+Number(editing.id)+')">삭제</button>':'')+'</div></div>':'';
  return '<section class="card my-setlist-workspace" id="mySetlistWorkspace"><div class="setlist-heading"><div><h2>MY SETLIST <span class="en">PERSONAL SONGS</span></h2><p class="card-intro">버스킹에 쓸 내 개인곡과 재생 자료를 관리해요.</p><p class="setlist-required"><b>등록 전 필수</b> · 곡명 · 원곡 가수 · 재생 링크 또는 파일</p></div><div class="setlist-tools">'+(issueCount?'<span class="setlist-alert">⚠ 수정 필요 '+issueCount+'곡</span>':'')+'<span class="setlist-count">'+mySongs.length+'곡</span><button type="button" class="open-setlist-editor" onclick="openMySetlistEditor()">＋ 셋리스트 만들기</button></div></div><div id="mySongList" class="my-song-list">'+list+'</div>'+editor+'<p class="setlist-footnote"><b>내 곡만</b> 추가·수정·삭제할 수 있어요. 다른 회원의 곡과 전체 관리 기능은 운영진이 Members에서 관리합니다.</p></section>';
}
function focusMySetlist(focusEditor=false){
  const target=document.getElementById('mySetlistWorkspace');
  if(!target)return;
  target.scrollIntoView({behavior:'smooth',block:'start'});
  if(focusEditor)window.setTimeout(()=>document.getElementById('mySongTitle')?.focus(),260);
}
function openMySetlistEditor(){
  editingMySongId=null;
  setlistEditorOpen=true;
  renderDashboard();
  focusMySetlist(true);
}
function selectedMySongReferenceType(){
  return document.querySelector('input[name="mySongReferenceType"]:checked')?.value||'';
}
function setMySongReferenceType(type){
  document.querySelectorAll('input[name="mySongReferenceType"]').forEach(input=>{input.checked=input.value===type});
  const linkField=document.getElementById('mySongYoutubeField');
  const fileField=document.getElementById('mySongFileField');
  if(linkField)linkField.hidden=type!=='link';
  if(fileField)fileField.hidden=type!=='file';
}
function updateMySongReferenceType(){setMySongReferenceType(selectedMySongReferenceType())}
function editMySong(id){
  if(!mySongs.some(song=>String(song.id)===String(id)))return;
  editingMySongId=String(id);
  setlistEditorOpen=true;
  renderDashboard();
  focusMySetlist(true);
}
function cancelMySongEdit(){
  editingMySongId=null;
  setlistEditorOpen=false;
  renderDashboard();
  focusMySetlist();
}
const mySongAttachmentMime={mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',amr:'audio/amr',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/opus',flac:'audio/flac','3gp':'audio/3gpp',webm:'audio/webm',pdf:'application/pdf'};
const mySongAttachmentMaxBytes=50*1024*1024;
function mySongAttachmentDetails(file){
  const hit=String(file?.name||'').toLowerCase().match(/\.([a-z0-9]+)$/);
  const ext=hit?hit[1]:'';
  if(!mySongAttachmentMime[ext])throw new Error('MP3 · M4A · AAC · AMR · WAV · OGG · OPUS · FLAC · 3GP · WEBM · PDF 파일만 첨부할 수 있습니다.');
  if(Number(file?.size||0)>mySongAttachmentMaxBytes)throw new Error('첨부 파일은 50MB 이하만 올릴 수 있습니다.');
  return {ext,mime:mySongAttachmentMime[ext]};
}
async function uploadMySongAttachment(file){
  const details=mySongAttachmentDetails(file);
  const token=window.crypto?.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
  const path='repertoire/'+String(myMember.id)+'/'+Date.now()+'-'+token+'.'+details.ext;
  const {error}=await db.storage.from('busking-files').upload(path,file,{cacheControl:'3600',upsert:false,contentType:details.mime});
  if(error)throw new Error('파일 업로드에 실패했습니다. '+error.message);
  const {data}=db.storage.from('busking-files').getPublicUrl(path);
  return {file_url:data.publicUrl,file_name:file.name,file_path:path};
}
async function removeMySongAttachment(path){
  if(!path)return;
  const {error}=await db.storage.from('busking-files').remove([path]);
  if(error)console.warn('MY SETLIST FILE DELETE:',error);
}
async function addMySongLog(actionType,targetId,detail){
  try{
    await db.from('activity_logs').insert({
      action_type:actionType,
      target_type:'MEMBER_SONG',
      target_id:String(targetId||''),
      target_name:String(myMember?.name||myMember?.nickname||''),
      detail:detail||{}
    });
  }catch(error){console.warn('MY SETLIST LOG:',error)}
}
async function saveMySong(){
  if(!myMember)return;
  const title=document.getElementById('mySongTitle').value.trim();
  const artist=document.getElementById('mySongArtist').value.trim();
  if(!title)return say('곡명을 입력해 주세요.',true);
  if(!artist)return say('원곡 가수를 입력해 주세요.',true);
  const referenceType=selectedMySongReferenceType();
  if(!referenceType)return say('재생 자료 방식을 선택해 주세요. 링크 또는 파일 첨부 중 하나를 골라 주세요.',true);
  const id=editingMySongId;
  const before=id?mySongs.find(song=>String(song.id)===String(id)):null;
  const duetName=document.getElementById('mySongDuet').value.trim();
  const duet=members.find(member=>String(member.name||member.nickname||'').trim()===duetName);
  const pickedFile=document.getElementById('mySongFile').files?.[0];
  let linkUrl=null;
  let attachment={file_url:null,file_name:null,file_path:null};
  if(referenceType==='link'){
    linkUrl=mySongReferenceUrl(document.getElementById('mySongYoutube').value);
    if(!linkUrl)return say('재생 링크를 정확히 입력해 주세요.',true);
  }else if(pickedFile){
    try{attachment=await uploadMySongAttachment(pickedFile)}catch(error){return say(error.message||'파일 업로드를 준비하지 못했습니다.',true)}
  }else if(before?.file_url&&mySongReferenceUrl(before.file_url)){
    attachment={file_url:before.file_url||null,file_name:before.file_name||null,file_path:before.file_path||null};
  }else{return say('파일을 선택해 주세요.',true)}
  const payload={
    member_id:String(myMember.id),
    vocalist_name:myMember.name||myMember.nickname||'',
    song_title:title,
    artist_name:artist,
    duet_member_id:duet?String(duet.id):null,
    duet_name:duetName,
    youtube_url:linkUrl,
    ...attachment
  };
  const query=id?db.from('busking_repertoire').update(payload).eq('id',id):db.from('busking_repertoire').insert(payload).select('id').single();
  const {data,error}=await query;
  if(error)return say(error.message||'개인곡을 저장하지 못했습니다.',true);
  if(before?.file_path&&before.file_path!==attachment.file_path)await removeMySongAttachment(before.file_path);
  const savedId=id||(data&&data.id)||'';
  await addMySongLog(id?'UPDATE':'ADD',savedId,{
    song_title:title,
    artist_name:artist,
    duet_name:duetName,
    link_changed:id?String(before?.youtube_url||'')!==String(payload.youtube_url||''):!!payload.youtube_url,
    file_changed:id?String(before?.file_path||'')!==String(payload.file_path||''):!!payload.file_path
  });
  editingMySongId=null;
  setlistEditorOpen=false;
  await loadMySongs();
  renderDashboard();
  focusMySetlist();
  say('MY SETLIST에 저장했어요.');
}
async function deleteMySong(id){
  const before=mySongs.find(song=>String(song.id)===String(id));
  if(!before)return;
  if(!confirm('내 개인곡을 삭제할까요? 이미 사용 중인 버스킹 셋리스트에서는 곡이 빠질 수 있어요.'))return;
  const {error}=await db.from('busking_repertoire').delete().eq('id',id);
  if(error)return say(error.message||'개인곡을 삭제하지 못했습니다.',true);
  if(before.file_path)await removeMySongAttachment(before.file_path);
  await addMySongLog('DELETE',id,{song_title:before.song_title||'',artist_name:before.artist_name||''});
  if(String(editingMySongId)===String(id))editingMySongId=null;
  setlistEditorOpen=false;
  await loadMySongs();
  renderDashboard();
  focusMySetlist();
  say('개인곡을 삭제했어요.');
}

async function loginAdministrator(){
 const form=document.getElementById('adminLoginForm');if(!form.reportValidity())return;const btn=document.getElementById('adminLoginSubmit'),note=document.getElementById('adminLoginNotice');if(btn.disabled)return;btn.disabled=true;note.hidden=true;
 try{const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('adminEmail').value.trim(),password:document.getElementById('adminPassword').value});if(error)throw new Error('관리자 이메일과 비밀번호를 확인해 주세요.');
   const context=await requestAccess({action:'context'},data.session.access_token);if(!context.is_admin){await db.auth.signOut({scope:'local'});throw new Error('관리자 계정으로 로그인해 주세요.');}
   const next=new URLSearchParams(location.search).get('next');location.replace(next&&/^\/(members|calendar|schedule|live|busking)(\/|$)/.test(next)?next:'/admin-settings/');
 }catch(error){await db.auth.signOut({scope:'local'});note.textContent=error.message||'관리자 로그인을 확인하지 못했습니다.';note.hidden=false;}finally{btn.disabled=false;}
}
async function loginAccount(){
 const form=document.getElementById('memberLoginForm');if(!form.reportValidity())return;
 const btn=document.getElementById('loginButton');if(btn.disabled)return;let memberId=null,name='';
 if(loginMode==='MEMBER'){memberId=Number(document.getElementById('loginMemberId').value)||null;if(!memberId){const typed=document.getElementById('loginNameSearch').value.trim();const exact=loginMembers.filter(member=>member.name===typed||member.nickname===typed);if(exact.length===1){chooseLoginMember(exact[0].id);memberId=Number(exact[0].id);}}if(!memberId){drawMemberPicker();loginNotice('회원 이름을 검색한 뒤 목록에서 선택해 주세요.');return;}name=document.getElementById('loginNameSearch').value;}else name=document.getElementById('loginName').value;
 btn.disabled=true;btn.textContent='로그인 확인 중…';loginNotice('');closeMemberPicker();
 try{
  const data=await requestAccess({action:'login',login_name:name,...(memberId?{member_id:memberId}:{}),password:document.getElementById('loginPassword').value});
  const result=await db.auth.setSession(data.session);if(result.error)throw result.error;
  if(data.state==='PENDING'){await db.auth.signOut({scope:'local'});throw new Error('가입 승인 안내를 받은 뒤 로그인해 주세요.');}
  await loadSession();if(!myMember)throw new Error('로그인 계정과 회원 정보의 연결을 확인하지 못했습니다. 운영진에게 확인해 주세요.');const warning=await loadWorkspace();render();window.vomRefreshShell?.();if(warning)say(warning,true);
  const next=new URLSearchParams(location.search).get('next');if(data.state==='APPROVED'&&next&&/^\/(members|calendar|schedule|live|busking)(\/|$)/.test(next))location.replace(next);
 }catch(error){loginNotice(error.message);say(error.message,true);}finally{if(btn.isConnected){btn.disabled=false;btn.textContent='로그인';}}
}

async function saveProfile(){if(!myMember)return;const favorite=document.getElementById('profileFavorite').value.trim();const job=document.getElementById('profileJob').value.trim();const {error}=await db.from('members').update({favorite_singers:favorite||null,job:job||null}).eq('id',myMember.id);if(error)return say(error.message||'프로필을 저장하지 못했습니다.',true);myMember.favorite_singers=favorite;myMember.job=job;say('프로필을 저장했어요.')}
async function changePassword(){const password=document.getElementById('newPassword').value;const confirm=document.getElementById('newPasswordConfirm').value;const hint=document.getElementById('newHint').value.trim();if(password.length<8||password.length>64)return say('새 비밀번호는 8~64자로 입력해 주세요.',true);if(password!==confirm)return say('새 비밀번호 확인이 일치하지 않습니다.',true);const {error}=await db.auth.updateUser({password:authPassword(password)});if(error)return say(error.message||'비밀번호를 바꾸지 못했습니다.',true);const {error:settingError}=await db.from('member_account_settings').update({password_hint:hint||null,must_change_password:false,password_changed_at:new Date().toISOString()}).eq('member_id',myMember.id);if(settingError)return say(settingError.message||'힌트를 저장하지 못했습니다.',true);accountSetting={...(accountSetting||{}),password_hint:hint,must_change_password:false};render();say('개인 비밀번호를 저장했어요.')}
async function logout(){await db.auth.signOut();session=null;myMember=null;accountSetting=null;mySongs=[];editingMySongId=null;render();window.vomRefreshShell?.();say('로그아웃했어요.')}
function openMenu(){const el=document.getElementById('menuOverlay');el.classList.add('open');el.setAttribute('aria-hidden','false')}
function closeMenu(){const el=document.getElementById('menuOverlay');el.classList.remove('open');el.setAttribute('aria-hidden','true')}
document.getElementById('menuOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
(async()=>{try{await loadSession();if(myMember){const warning=await loadWorkspace();render();if(warning)say(warning,true);}else{try{await loadLoginMembers();}catch(error){loginMembersError=error.message;}render();}}catch(error){try{await loadLoginMembers();}catch(_){}renderWelcome();loginNotice(error.message||'잠시 후 다시 시도해 주세요.');}})();
</script>
